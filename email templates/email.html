<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0px 0;
        }
        .email-container {
            width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 10px;
        }
        .header {
            background-color: #616161;
            color: white;
            padding: 10px 20px;
            border-radius: 10px 10px 0 0;
            font-size: 20px;
            font-weight: bold;
        }
        .content {
            padding: 20px;
        }
        .appointment-details {
            margin: 20px 0;
            padding: 10px 0;
        }
        .details-row {
            margin-bottom: 10px;
        }
        .details-label {
            font-weight: bold;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
    <div class="email-container">
        <div class="header">
            Booking Notification
        </div>
        <div class="content">
            <p>A new booking has been made. See details below:</p>
            <div class="appointment-details">
                <div class="details-row">
                    <span class="details-label">Name:</span> ${name}
                </div>
                <div class="details-row">
                    <span class="details-label">Email:</span> ${email}
                </div>
                <div class="details-row">
                    <span class="details-label">Confirmation Code:</span> ${code}
                </div>
                <div class="details-row">
                    <span class="details-label">Unit:</span> ${unit}
                </div>
                <div class="details-row">
                    <span class="details-label">Date(s):</span> ${date}
                </div>
                <div class="details-row">
                    <span class="details-label">Time:</span> ${startTime} - ${endTime}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
